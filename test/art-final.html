<!doctype html>
<html><head><meta charset="utf-8"><title>Wildside Zoo style D final</title>
<style> html, body { margin: 0; background: #f6eedc; } canvas { display: block; image-rendering: pixelated; } </style></head><body>
<script src="../geo.js"></script>
<script src="../data.js"></script>
<script src="../sprites.js"></script>
<script>
/* Artist: the final style-D showcase, drawn by sprites.js itself at density 2 (ZSprites.setDensity(2) with ZGeo doubled the
   way the Lead will ship it). One phone-width column, 1170 px (390 CSS px at 3x), cut into pages under 7,000 px.
   Assets at 2x phone size (12 phone px per art pixel) unless a label says "real size". test/art-final.js saves the pages. */
'use strict';
window.__err = []; window.onerror = function (m) { window.__err.push(String(m)); };
var S = window.ZSprites, D = window.ZD, G = window.ZGeo; // G: today's geometry, used only to lay pages out
(function () { // double ZGeo, then switch the sprites to density 2
  var A = [G.A[0] * 2, G.A[1] * 2], B = [G.B[0] * 2, G.B[1] * 2], g = { A: A, B: B };
  g.CORNERS = G.CORNERS.map(function (c) { return [c[0] * 2, c[1] * 2]; }); g.EDGES = G.EDGES; g.W = G.W * 2; g.H = G.H * 2; g.HW = G.HW * 2; g.HH = G.HH * 2;
  g.toScreen = function (q, r) { return { x: A[0] * q + B[0] * r, y: A[1] * q + B[1] * r }; };
  g.toAxial = function (x, y) { return G.toAxial(x / 2, y / 2); }; g.edgeMidY = function (e) { return G.edgeMidY(e) * 2; };
  g.depth = function (q, r, dy) { return A[1] * q + B[1] * r + (dy || 0); };
  window.ZGeo = g; S.setDensity(2);
})();
var CREAM = '#f6eedc', CARD = '#fbf6ea', INK = '#2a1d33', SOFT = '#7a6a5a', PW = 1170, SC = 12;
function spr(o) {
  var s, op = { frame: o.frame, variant: o.variant, juv: o.juv, seed: o.seed, flip: o.flip };
  if (o.t === 'animal') s = S.animal(o.id, op); else if (o.t === 'person') s = S.person(o.id, op); else if (o.t === 'building') s = S.building(o.id, op);
  else if (o.t === 'fence') s = S.fence(o.biome, o.e); else if (o.t === 'deco') s = S.deco(o.id, o.seed); else if (o.t === 'entrance') s = S.entrance();
  else if (o.t === 'tile') s = S.tile(o.kind, o.seed); else if (o.t === 'icon') s = S.icon(o.id);
  return s;
}
function put(g, s, x, y, dev) { var f = dev / (s.d || 1); g.drawImage(s.c, Math.round(x - s.ax * f), Math.round(y - s.ay * f), s.w * f, s.h * f); }
function W(s, dev) { return s.w * dev / (s.d || 1); } function Hh(s, dev) { return s.h * dev / (s.d || 1); }
function label(g, t, x, y, sz, col, al, bold) { g.font = (bold ? 'bold ' : '') + sz + 'px system-ui, sans-serif'; g.textAlign = al || 'center'; g.fillStyle = col || SOFT; g.fillText(t, x, y); }
function scene(g, list, ox, oy, dev, extra) { // hexes [q, r, kind] with fences round each habitat, plus objects; positions in today's art pixels
  var tiles = [], objs = [], HB = {};
  list.forEach(function (h) { if (h[2].indexOf('hab:') === 0) HB[h[0] + ',' + h[1]] = h[2].slice(4); });
  list.forEach(function (h) { var p = G.toScreen(h[0], h[1]); tiles.push({ kind: h[2], seed: ((h[0] * 7 + h[1] * 13) % 18 + 18) % 18, x: p.x, y: p.y });
    var b = HB[h[0] + ',' + h[1]]; if (b) for (var e = 0; e < 6; e++) { var nb = G.EDGES[e][0]; if (HB[(h[0] + nb[0]) + ',' + (h[1] + nb[1])] !== b) objs.push({ t: 'fence', biome: b, e: e, x: p.x, y: p.y, sy: p.y + G.edgeMidY(e) }); } });
  (extra || []).forEach(function (o) { if (o.sy == null) o.sy = o.y + (o.t === 'entrance' ? G.HH : 0); objs.push(o); });
  tiles.sort(function (a, b) { return a.y - b.y || a.x - b.x; }); objs.sort(function (a, b) { return a.sy - b.sy; });
  tiles.forEach(function (t) { put(g, spr({ t: 'tile', kind: t.kind, seed: t.seed }), ox + t.x * dev, oy + t.y * dev, dev); });
  objs.forEach(function (o) { put(g, spr(o), ox + o.x * dev, oy + o.y * dev, dev); });
}
function ob(t, id, q, r, dx, dy, more) { var p = G.toScreen(q, r); return Object.assign({ t: t, id: id, x: p.x + dx, y: p.y + dy }, more || {}); }
// ---------- blocks: each has a height and a draw(g, y) ----------
var BL = [];
function card(g, y, h, col) { g.fillStyle = col || CARD; g.fillRect(16, y, PW - 32, h); }
function heading(t, sub) { BL.push({ h: sub ? 150 : 110, head: true, draw: function (g, y) { label(g, t, 32, y + 76, 52, INK, 'left', true); if (sub) label(g, sub, 32, y + 120, 28, SOFT, 'left'); } }); }
function row(items, dev, pad, opts) { // items: [{s, lab}] side by side, bottoms aligned
  opts = opts || {}; var hmax = 0, wsum = 0; items.forEach(function (it) { hmax = Math.max(hmax, it.s.ay * dev / (it.s.d || 1)); wsum += W(it.s, dev); });
  var below = 0; items.forEach(function (it) { below = Math.max(below, Hh(it.s, dev) - it.s.ay * dev / (it.s.d || 1)); });
  var h = hmax + below + 90 + (opts.title ? 50 : 0);
  BL.push({ h: h + 16, draw: function (g, y) {
    card(g, y, h, opts.col); if (opts.title) label(g, opts.title, 44, y + 44, 32, opts.col ? '#ffffff' : INK, 'left', true);
    var gap = (PW - 32 - wsum) / (items.length + 1), x = 16 + gap, base = y + (opts.title ? 50 : 0) + 20 + hmax;
    items.forEach(function (it) { var w = W(it.s, dev); put(g, it.s, x + it.s.ax * dev / (it.s.d || 1), base, dev); if (it.lab) label(g, it.lab, x + w / 2, base + below + 46, 26, opts.col ? '#ffffff' : SOFT); x += w + gap; });
  } });
}
function build() {
  var DEV = 6, OX = 40, OY = 46, SH = 300 * DEV;
  BL.push({ h: SH, draw: function (g, y) {
    g.save(); g.translate(0, y); g.beginPath(); g.rect(0, 0, PW, SH); g.clip(); g.fillStyle = '#86c94e'; g.fillRect(0, 0, PW, SH);
    var H = {}, list = []; ['0,0', '1,0', '0,1'].forEach(function (k) { H[k] = 'hab:savanna'; }); ['2,2', '1,3', '2,3'].forEach(function (k) { H[k] = 'hab:arctic'; });
    ['2,0', '1,1', '0,2', '1,2', '0,3', '0,4', '0,5', '0,6', '-1,4', '-1,5', '1,4', '0,7', '-1,7'].forEach(function (k) { H[k] = 'path'; });
    for (var r = -3; r <= 10; r++) for (var q = -5; q <= 7; q++) { var p = G.toScreen(q, r); if (p.x + OX < -30 || p.x + OX > 225 || p.y + OY < -25 || p.y + OY > 325) continue; list.push([q, r, H[q + ',' + r] || 'grass']); }
    scene(g, list, OX * DEV, OY * DEV, DEV, [ob('animal', 'lion', 0, 0, -6, 4), ob('animal', 'giraffe', 1, 0, -10, -3), ob('animal', 'zebra', 1, 0, 7, 3, { frame: 1 }), ob('animal', 'elephant', 0, 1, 2, 4),
      ob('animal', 'penguin', 2, 2, -6, 2), ob('animal', 'penguin', 2, 2, 7, 5, { juv: true }), ob('animal', 'polarbear', 1, 3, 2, 4, { flip: true }), ob('animal', 'penguin', 2, 3, 0, 2, { variant: true }),
      ob('building', 'snack', -1, 4, 0, 0), ob('building', 'cafe', -1, 5, 0, 0), ob('person', 'visitor', 1, 1, 4, 6, { seed: 11 }), ob('person', 'visitor', 0, 3, -4, 2, { seed: 3, flip: true }),
      ob('person', 'visitor', 0, 4, 6, -2, { seed: 20, frame: 1 }), ob('person', 'keeper', 0, 6, -12, -6), ob('person', 'trader', 0, 6, 10, -5, { flip: true }), ob('entrance', 'gate', 0, 7, 0, 0),
      ob('deco', 'tree', 1, 5, 2, 6), ob('deco', 'bush', -1, 6, 4, 2), ob('deco', 'tree', 2, 4, 6, 0, { seed: 1 }), ob('deco', 'flowers', -2, 6, 6, 4, { seed: 1 }), ob('deco', 'lamp', 1, 6, -14, 6)]);
    g.restore(); g.fillStyle = 'rgba(42,29,51,0.72)'; g.fillRect(0, y + SH - 70, PW, 70); label(g, 'Style D at real size on your phone', PW / 2, y + SH - 24, 34, '#ffffff', 'center', true);
  } });
  var biomes = {}; D.SPECIES_LIST.forEach(function (sp) { (biomes[sp.biome] = biomes[sp.biome] || []).push(sp); });
  var NAMES = { savanna: 'Savanna', jungle: 'Jungle', desert: 'Desert and outback', arctic: 'Arctic', mountain: 'Mountain', ocean: 'Ocean', paleo: 'Lost valley', mythic: 'Mythic grove' };
  D.BIOME_ORDER.forEach(function (b) {
    heading(NAMES[b] || b, 'Normal, rare and young.');
    (biomes[b] || []).forEach(function (sp) {
      var it = [{ s: spr({ t: 'animal', id: sp.id }), lab: 'normal' }, { s: spr({ t: 'animal', id: sp.id, variant: true }), lab: 'rare: ' + String(sp.variant || 'rare').toLowerCase() }, { s: spr({ t: 'animal', id: sp.id, juv: true }), lab: 'young' }];
      var wsum = 0; it.forEach(function (i) { wsum += W(i.s, SC); });
      var col = b === 'ocean' ? '#4aa3d8' : null;
      if (wsum > PW - 120) { row(it.slice(0, 2), SC, 0, { title: sp.name, col: col }); row(it.slice(2), SC, 0, { col: col }); } else row(it, SC, 0, { title: sp.name, col: col });
    });
  });
  heading('People', 'Every staff role, the callers, the special guests and twelve visitors.');
  var P = S.PERSON_KINDS.filter(function (k) { return k !== 'visitor' && k !== 'person'; }).map(function (k) { return { s: spr({ t: 'person', id: k }), lab: k }; });
  for (var i = 0; i < 12; i++) P.push({ s: spr({ t: 'person', id: 'visitor', seed: i * 8 + 1 }), lab: 'visitor' });
  for (i = 0; i < P.length; i += 4) row(P.slice(i, i + 4), SC);
  heading('Buildings');
  var Bs = D.FAC_ORDER.map(function (id) { var f = (D.FACILITIES && D.FACILITIES[id]) || {}; return { s: spr({ t: 'building', id: id }), lab: f.name || id }; });
  for (i = 0; i < Bs.length; i += 2) row(Bs.slice(i, i + 2), SC);
  row([{ s: spr({ t: 'entrance' }), lab: 'entrance gate' }], SC);
  heading('Ground', 'Real size. Grass looks, path, land for sale, water and every habitat.');
  var T = [['grass', 0], ['grass', 7], ['grass', 14], ['path', 0], ['locked', 0], ['water', 0]].concat(D.BIOME_ORDER.map(function (b) { return ['hab:' + b, 0]; }))
    .map(function (t) { return { s: spr({ t: 'tile', kind: t[0], seed: t[1] }), lab: t[0].replace('hab:', '') }; });
  for (i = 0; i < T.length; i += 3) row(T.slice(i, i + 3), 6);
  heading('Fences', 'Real size: all eight fence styles round a small habitat.');
  var FA = { savanna: 'zebra', jungle: 'toucan', desert: 'camel', arctic: 'penguin', mountain: 'goat', ocean: 'seal', paleo: 'raptor', mythic: 'unicorn' };
  for (i = 0; i < D.BIOME_ORDER.length; i += 2) (function (pair) {
    BL.push({ h: 360, draw: function (g, y) { card(g, y, 344); pair.forEach(function (b, n) { var ox = 190 + n * 560, oy = y + 160;
      scene(g, [[0, 0, 'hab:' + b], [1, 0, 'hab:' + b]], ox, oy, 6, [ob('animal', FA[b], 0, 0, 0, 4), ob('animal', FA[b], 1, 0, 0, 6, { juv: true, flip: true })]); label(g, b, ox + 120, y + 330, 26); }); } });
  })(D.BIOME_ORDER.slice(i, i + 2));
  heading('Decorations');
  var DD = [['tree', 0], ['tree', 1], ['tree', 2], ['tree', 3], ['bush', 0], ['bush', 1], ['flowers', 0], ['flowers', 1], ['rock', 0], ['rock', 1], ['lamp', 0], ['crate', 0]].map(function (d) { return { s: spr({ t: 'deco', id: d[0], seed: d[1] }), lab: d[0] }; });
  for (i = 0; i < DD.length; i += 4) row(DD.slice(i, i + 4), SC);
  heading('Icons', 'Every icon, at twice its menu size.');
  var IC = S.ICONS.map(function (n) { return { s: spr({ t: 'icon', id: n }), lab: n }; });
  for (i = 0; i < IC.length; i += 6) row(IC.slice(i, i + 6), SC);
}
window.__final = function (maxH) {
  build(); var pages = [], cur = null, y = 0;
  function newPage() { cur = []; pages.push(cur); y = 0; }
  newPage();
  BL.forEach(function (b, n) { var nextH = b.head && BL[n + 1] ? BL[n + 1].h : 0; if (y + b.h + nextH > maxH && cur.length) newPage(); cur.push({ b: b, y: y }); y += b.h; });
  return pages.map(function (pg) {
    var h = 0; pg.forEach(function (e) { h = e.y + e.b.h; }); h += 20;
    var c = document.createElement('canvas'); c.width = PW; c.height = h; var g = c.getContext('2d'); g.imageSmoothingEnabled = false; g.fillStyle = CREAM; g.fillRect(0, 0, PW, h);
    pg.forEach(function (e) { e.b.draw(g, e.y); }); return c.toDataURL('image/png');
  });
};
</script>
