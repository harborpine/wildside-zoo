'use strict';
window.__err = []; window.onerror = function (m) { window.__err.push(String(m)); };
var CREAM = '#f6eedc', CARD = '#fbf6ea', INK = '#2a1d33', SOFT = '#7a6a5a', PW = 1170;
function label(g, t, x, y, sz, col, al, bold) { g.font = (bold ? 'bold ' : '') + sz + 'px system-ui, sans-serif'; g.textAlign = al || 'center'; g.fillStyle = col || SOFT; g.fillText(t, x, y); }
function put(g, s, x, y, dev) { var f = dev / (s.K || 1); g.drawImage(s.c, Math.round(x - s.ax * f), Math.round(y - s.ay * f), s.w * f, s.h * f); }
function solid(s) { // the same sprite as a solid black silhouette (the soft ground shadow left out)
  var c = document.createElement('canvas'); c.width = s.w; c.height = s.h; var g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(s.c, 0, 0);
